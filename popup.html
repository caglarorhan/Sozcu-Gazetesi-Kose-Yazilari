<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/materialize.min.css">
    <link rel="stylesheet" href="./css/popup.css">

    <title>SGKY</title>
</head>
<body>
<div class="container">
    <div class="speech-overlay" id="speechOverlay" hidden>
        <div class="speech-overlay-dialog" role="status" aria-live="polite">
            <strong id="speechOverlayMessage">Turkce ses hazirlaniyor</strong>
            <span id="speechOverlayProgress">0%</span>
        </div>
    </div>
    <div class="chunk-indicator" id="chunkIndicator" role="status" aria-live="polite" hidden>
        <span class="chunk-indicator-spinner"></span>
        <span id="chunkIndicatorText">Sonraki ses bolumu hazirlaniyor</span>
    </div>
    <div class="row less">

        <div class="col s5 collection scrolling" id="columnistList">

        </div>
        <div class="col s7" id="columnText">
            <div class="center-align" style="width: 100%; height: 100%">
                <h3 class="center-align" style="margin-top: 100px;">Sözcü Gazetesi Köşe Yazarları</h3>
                <img src="./img/sgky_256.png" alt="SGKY Browser Eklentisi Ikonu" class="center-align">
            </div>

        </div>
    </div>
    <footer class="popup-footer">
        <span>Icons from <a href="https://www.flaticon.com/authors/catkuro" target="_blank">catkuro</a></span>
        <a href="https://uyelik.sozcu.com.tr/kayitpromo" target="_blank">Lutfen Sözcü Gazetesini desteklemek icin abone olun!</a>
    </footer>
</div>
<!-- Modal Structure -->
<div id="mainModal" class="modal modal-modified">
    <div class="modal-content">
        <h4>Sample Modal</h4>
        <p>Modal body text.</p>
    </div>
    <div class="modal-footer modal-footer-modified">
        <a href="#!" class="modal-close waves-effect waves-green btn-flat">Kapat</a>
    </div>
</div>
<script src="js/materialize.min.js" ></script>
<script type="module" src="js/popup.js"></script>
</body>
</html>
